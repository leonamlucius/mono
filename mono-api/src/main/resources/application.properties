server.port=8080
spring.application.name=mono-api

spring.ai.openai.api-key=${GROQ_API_KEY}
# Redireciona o Spring AI para a estrutura da Groq
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:0.5b

# URL de conexão com o banco que está rodando no Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/nomedobanco
spring.datasource.username=user
spring.datasource.password=password

# O Hibernate vai criar as tabelas automaticamente para você na primeira vez que rodar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Desativa a proteção de frames para conseguir abrir o console do H2 com o Spring Security (se já tiver usando)
spring.ライフサイクル.spring.h2.console.settings.web-allow-others=true


jwt.secret=o_segredo_do_mono_precisa_ser_uma_chave_muito_longa_e_segura_123456
jwt.expiration=86400000