<ng-container *ngIf="isInitialized()">
    <div class="logo-container">
        <img src="/img/mono.svg" title="MONO" alt="MONO">
    </div>
</ng-container>

<app-body-component [isInitialized]="isInitialized()"></app-body-component>
<app-input-component (textoChange)="isTypeSomething.set($event)"></app-input-component>

<button class="send-button" (click)="iniciar()">
    <span class="material-symbols-outlined">
     chevron_right
    </span>
</button>

<div class="information">
    <span class="material-symbols-outlined">
        info
    </span>
</div>


<div class="madeBy">
   <ng-icon name="bootstrapLinkedin" title="LinkedIn" (click)="goTolinkedin()"/>
   <ng-icon name="bootstrapGithub" title="GitHub" (click)="goToGithub()"/>
  
</div>

<router-outlet />
