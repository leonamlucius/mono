


<ng-container *ngIf="!isInitialized">

  <div class="logo-container">
    <img src="/img/mono.svg" alt="Logo" class="logo">
     <p  @fadeText>{{ textoAtual() }}</p>
  </div>
</ng-container>
<div *ngIf="isInitialized" class="chat-container">
    <div *ngFor="let item of chatHistory" [class.bot]="item.sendBy === 'Bot'" [class.user]="item.sendBy === 'User'" [class.loading]="item.loading" class="message">
      <p >{{ item.text }}</p>
    </div>
</div>
