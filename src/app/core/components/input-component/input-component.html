<form (ngSubmit)="sendText()">
  <div
    #waveformContainer
    class="waveform-visualizer"
    [class.invisible]="!micIsON()"
  ></div>
  <textarea
    #meuTextarea
    (input)="onInput(meuTextarea)"
    placeholder="Sobre o que é a sua dúvida?"
    (keydown.enter)="$event.preventDefault(); sendText()  
    "
    [class.invisible]="micIsON()"
    title="Digite sua dúvida"
  ></textarea>

  <app-select-llm-component id="llmSelect" [llmType]="llmType">
  </app-select-llm-component>

  <button
    type="button"
    class="microphone-button"
    (click)="recordingMic()"
    [disabled]="showLoading()"
    title="Gravar Áudio"
  >
    <span class="material-symbols-outlined" *ngIf="!micIsON()"> mic </span>
    <span
      class="material-symbols-outlined"
      id="listeningIcon"
      *ngIf="micIsON()"
      [class.pulse]="micIsON()"
      title="Parar gravação de Áudio"
    >
      stop_circle
    </span>
  </button>

  <button
    type="button"
    class="cancel-button"
    *ngIf="micIsON()"
    (click)="cancelRecording()"
    title="Cancelar gravação"
  >
    <span class="material-symbols-outlined"> cancel </span>
  </button>

  <button
    type="submit"
    class="send-button"
    [disabled]="showLoading() || micIsON()"
    title="Enviar"
  >
    <span *ngIf="!showLoading()" class="material-symbols-outlined">
      chevron_right
    </span>

    <span
      *ngIf="showLoading()"
      class="material-symbols-outlined"
      id="loadingIcon"
    >
      progress_activity
    </span>
  </button>
</form>
