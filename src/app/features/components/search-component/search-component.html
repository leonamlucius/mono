<span class="material-symbols-outlined"> search </span>
<input
  class="search-input"
  type="text"
  placeholder="Pesquisar..."
  [value]="searchTerm()"
  (input)="search($event)"
  (keydown.enter)="$event.preventDefault(); search($event)"
/>
<button *ngIf="searchTerm()" (click)="clearSearch()" title="Limpar pesquisa">
  <span class="material-symbols-outlined"> close </span>
</button>

<app-filter-button-component
  *ngIf="showButton()"
  [selectedMessages]="selectedMessages"
>
</app-filter-button-component>

<app-warning></app-warning>
